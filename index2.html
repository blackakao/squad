<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Auto Battle Prototype</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

h2 {
  margin: 16px;
}

.nav {
  margin: 0 16px 8px;
}

.page {
  width: 100%;
}

.page.hidden,
.modal.hidden {
  display: none;
}

.hidden {
  display: none !important;
}

#root {
  display: flex;
  width: 100%;
  height: calc(100vh - 64px);
}

.col {
  display: flex;
  flex-direction: column;
  padding: 5px;
  box-sizing: border-box;
}

.col.left { width: 25%; }
.col.center { width: 50%; }
.col.right { width: 25%; }

.panel {
  border: 1px solid #ccc;
  padding: 8px;
  margin-bottom: 5px;
  box-sizing: border-box;
}

.char-panel,
.enemy-control {
  height: 40%;
  overflow-y: auto;
}

.status-panel {
  flex: 1;
  overflow-y: auto;
}

.battle-panel {
  height: 80%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.control-panel {
  height: 20%;
  overflow-y: auto;
}

#battleCanvas {
  width: 100%;
  height: 100%;
  border: 1px solid #000;
}

button {
  margin: 3px;
}

.unit-status {
  margin-bottom: 10px;
}

.unit-meta {
  font-size: 11px;
}

.hp-track {
  background: #ddd;
}

.hp-fill {
  height: 6px;
}

#log {
  margin-top: 8px;
  max-height: 70px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.4;
  border-top: 1px solid #ddd;
  padding-top: 6px;
}

#monsterPage,
#characterPage {
  box-sizing: border-box;
  height: calc(100vh - 96px);
  padding: 5px 16px 16px;
}

.data-toolbar {
  margin-bottom: 8px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.data-table th,
.data-table td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
}

.data-table th:first-child,
.data-table td:first-child {
  width: 44px;
  text-align: center;
}

.data-table th:last-child,
.data-table td:last-child {
  width: 90px;
  text-align: center;
}

.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
}

.modal-content {
  width: min(420px, calc(100vw - 32px));
  border: 1px solid #999;
  background: #fff;
  padding: 16px;
  box-sizing: border-box;
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

.form-row input,
.form-row select {
  padding: 6px;
  box-sizing: border-box;
}
</style>
</head>
<body>

<h2>스쿼드 자동전투 프로토타입</h2>

<div class="nav">
  <button onclick="showPage('battle')">전투</button>
  <button onclick="showPage('character')">캐릭터 관리</button>
  <button onclick="showPage('monster')">몬스터 관리</button>
</div>

<div id="root" class="page">
  <div class="col left">
    <div class="panel char-panel">
      <h4>내 캐릭터</h4>
      <div id="characters"></div>
    </div>

    <div class="panel status-panel">
      <h4>아군 상태</h4>
      <div id="playerStatus"></div>
    </div>
  </div>

  <div class="col center">
    <div class="panel battle-panel">
      <canvas id="battleCanvas"></canvas>
    </div>

    <div class="panel control-panel">
      <h4>조작</h4>
      <button id="battleBtn" onclick="toggleBattle()">전투 시작</button>
      <button onclick="resetGame()">초기화</button>

      <h4>배속</h4>
      <button onclick="setSpeed(1)">x1</button>
      <button onclick="setSpeed(2)">x2</button>
      <button onclick="setSpeed(4)">x4</button>

      <div id="log"></div>
    </div>
  </div>

  <div class="col right">
    <div class="panel enemy-control">
      <h4>적 추가</h4>
      <div id="enemyButtons"></div>
    </div>

    <div class="panel status-panel">
      <h4>적 상태</h4>
      <div id="enemyStatus"></div>
    </div>
  </div>
</div>

<div id="monsterPage" class="page hidden">
  <div class="panel">
    <h4>몬스터 관리</h4>
    <div class="data-toolbar">
      <button onclick="openMonsterModal()">추가</button>
      <button onclick="deleteSelectedMonsters()">선택 삭제</button>
      <button onclick="resetMonsterJson()">기본값 복원</button>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>이름</th>
          <th>체력</th>
          <th>공격력</th>
          <th>역할</th>
          <th>수정</th>
        </tr>
      </thead>
      <tbody id="monsterTableBody"></tbody>
    </table>
  </div>
</div>

<div id="characterPage" class="page hidden">
  <div class="panel">
    <h4>캐릭터 관리</h4>
    <div class="data-toolbar">
      <button onclick="openCharacterModal()">추가</button>
      <button onclick="deleteSelectedCharacters()">선택 삭제</button>
      <button onclick="resetCharacterJson()">기본값 복원</button>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>이름</th>
          <th>체력</th>
          <th>공격력</th>
          <th>역할</th>
          <th>수정</th>
        </tr>
      </thead>
      <tbody id="characterTableBody"></tbody>
    </table>
  </div>
</div>

<div id="monsterModal" class="modal hidden">
  <div class="modal-content">
    <h4 id="monsterModalTitle">몬스터 추가</h4>
    <form id="monsterForm" onsubmit="saveMonsterFromForm(event)">
      <input type="hidden" id="monsterEditIndex">
      <div class="form-row">
        <label for="monsterLabel">이름</label>
        <input id="monsterLabel" required placeholder="슬라임">
      </div>
      <div class="form-row">
        <label for="monsterHp">체력</label>
        <input id="monsterHp" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="monsterAtk">공격력</label>
        <input id="monsterAtk" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="monsterRole">역할</label>
        <select id="monsterRole" required></select>
      </div>
      <button type="submit">저장</button>
      <button type="button" onclick="closeMonsterModal()">취소</button>
    </form>
  </div>
</div>

<div id="characterModal" class="modal hidden">
  <div class="modal-content">
    <h4 id="characterModalTitle">캐릭터 추가</h4>
    <form id="characterForm" onsubmit="saveCharacterFromForm(event)">
      <input type="hidden" id="characterEditIndex">
      <div class="form-row">
        <label for="characterName">이름</label>
        <input id="characterName" required placeholder="tank1">
      </div>
      <div class="form-row">
        <label for="characterHp">체력</label>
        <input id="characterHp" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="characterAtk">공격력</label>
        <input id="characterAtk" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="characterRole">역할</label>
        <select id="characterRole" required></select>
      </div>
      <button type="submit">저장</button>
      <button type="button" onclick="closeCharacterModal()">취소</button>
    </form>
  </div>
</div>

<script>
const canvas = document.getElementById("battleCanvas");
const ctx = canvas.getContext("2d");

const charactersEl = document.getElementById("characters");
const playerStatusEl = document.getElementById("playerStatus");
const enemyStatusEl = document.getElementById("enemyStatus");
const battleBtnEl = document.getElementById("battleBtn");
const logEl = document.getElementById("log");
const enemyButtonsEl = document.getElementById("enemyButtons");
const battlePageEl = document.getElementById("root");
const monsterPageEl = document.getElementById("monsterPage");
const characterPageEl = document.getElementById("characterPage");
const monsterTableBodyEl = document.getElementById("monsterTableBody");
const monsterModalEl = document.getElementById("monsterModal");
const monsterModalTitleEl = document.getElementById("monsterModalTitle");
const monsterFormEl = document.getElementById("monsterForm");
const monsterEditIndexEl = document.getElementById("monsterEditIndex");
const monsterLabelEl = document.getElementById("monsterLabel");
const monsterHpEl = document.getElementById("monsterHp");
const monsterAtkEl = document.getElementById("monsterAtk");
const monsterRoleEl = document.getElementById("monsterRole");
const characterTableBodyEl = document.getElementById("characterTableBody");
const characterModalEl = document.getElementById("characterModal");
const characterModalTitleEl = document.getElementById("characterModalTitle");
const characterFormEl = document.getElementById("characterForm");
const characterEditIndexEl = document.getElementById("characterEditIndex");
const characterNameEl = document.getElementById("characterName");
const characterHpEl = document.getElementById("characterHp");
const characterAtkEl = document.getElementById("characterAtk");
const characterRoleEl = document.getElementById("characterRole");

const ROLES = ["tank", "melee", "ranged", "healer"];
const MONSTER_STORAGE_KEY = "squadAutoBattle.monsters";
const CHARACTER_STORAGE_KEY = "squadAutoBattle.characters";
const DEFAULT_MONSTER_JSON = [
  { label: "슬라임", hp: 80, atk: 8, role: "melee" },
  { label: "오크", hp: 120, atk: 12, role: "ranged" },
  { label: "드래곤", hp: 200, atk: 20, role: "melee" }
];

const ROLE_STATS = {
  tank: { hp: 150, atk: 10, color: "gray", range: 10, speedMultiplier: 1.2 },
  melee: { hp: 100, atk: 10, color: "yellow", range: 10, speedMultiplier: 1.2 },
  ranged: { hp: 100, atk: 12, color: "blue", range: 60, speedMultiplier: 1 },
  healer: { hp: 100, atk: 10, color: "violet", range: 60, speedMultiplier: 1 }
};

const BASE_MOVE_SPEED = 1.2;
const ATTACK_COOLDOWN = 30;
const COLLISION_DISTANCE = 10;
const UNIT_RADIUS = 5;
const MAX_PLAYER_SQUAD = 10;
const PROJECTILE_SPEED = 7;
const EFFECT_DURATION = 18;
const EFFECT_COLORS = {
  damage: "#fff18f",
  heal: "#8fffc1"
};

let allCharacters = [];
let playerSquad = [];
let enemySquad = [];
let projectiles = [];
let isBattleRunning = false;
let gameSpeed = 1;
let scale = 1;
let monsterJson = [];
let characterJson = [];

function createStats() {
  return { damage: 0, taken: 0, heal: 0 };
}

function getRoleColor(role) {
  return ROLE_STATS[role]?.color ?? "black";
}

function getUnitRange(role) {
  return ROLE_STATS[role]?.range ?? 10;
}

function createDefaultCharacterJson() {
  const characters = [];

  ROLES.forEach(role => {
    const roleStat = ROLE_STATS[role];

    for (let i = 0; i < 5; i++) {
      characters.push({
        name: `${role}${i + 1}`,
        hp: roleStat.hp,
        atk: roleStat.atk,
        role
      });
    }
  });

  return characters;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  }[char]));
}

function normalizeCombatJson(items, defaults, nameKey) {
  if (!Array.isArray(items)) {
    return defaults.map(item => ({ ...item }));
  }

  if (items.length === 0) {
    return [];
  }

  const normalized = items
    .map(item => ({
      [nameKey]: String(item[nameKey] ?? item.label ?? item.name ?? "").trim(),
      hp: Number(item.hp),
      atk: Number(item.atk),
      role: String(item.role ?? "").trim()
    }))
    .filter(item => item[nameKey] && item.hp > 0 && item.atk > 0 && ROLES.includes(item.role));

  return normalized.length > 0 ? normalized : defaults.map(item => ({ ...item }));
}

function loadMonsterJson() {
  try {
    const savedJson = localStorage.getItem(MONSTER_STORAGE_KEY);
    monsterJson = savedJson
      ? normalizeCombatJson(JSON.parse(savedJson), DEFAULT_MONSTER_JSON, "label")
      : DEFAULT_MONSTER_JSON.map(monster => ({ ...monster }));
  } catch (error) {
    monsterJson = DEFAULT_MONSTER_JSON.map(monster => ({ ...monster }));
  }

  saveMonsterJson();
}

function saveMonsterJson() {
  try {
    localStorage.setItem(MONSTER_STORAGE_KEY, JSON.stringify(monsterJson));
  } catch (error) {
    log("몬스터 JSON 저장에 실패했습니다.");
  }
}

function refreshMonsterUI() {
  renderEnemyButtons();
  renderMonsterTable();
}

function renderEnemyButtons() {
  enemyButtonsEl.innerHTML = monsterJson.map((monster, index) => (
    `<button onclick="selectEnemy(${index})">${escapeHtml(monster.label)}</button>`
  )).join("");
}

function renderMonsterTable() {
  monsterTableBodyEl.innerHTML = monsterJson.map((monster, index) => `
    <tr>
      <td><input type="checkbox" class="monster-check" value="${index}"></td>
      <td>${escapeHtml(monster.label)}</td>
      <td>${monster.hp}</td>
      <td>${monster.atk}</td>
      <td>${escapeHtml(monster.role)}</td>
      <td><button onclick="openMonsterModal(${index})">수정</button></td>
    </tr>
  `).join("");
}

function showPage(pageName) {
  battlePageEl.classList.toggle("hidden", pageName !== "battle");
  monsterPageEl.classList.toggle("hidden", pageName !== "monster");
  characterPageEl.classList.toggle("hidden", pageName !== "character");
  if (pageName === "battle") {
    resizeCanvas();
  }
}

function openMonsterModal(index = "") {
  const monster = monsterJson[index];

  monsterModalTitleEl.innerText = monster ? "몬스터 수정" : "몬스터 추가";
  monsterEditIndexEl.value = monster ? index : "";
  monsterLabelEl.value = monster?.label ?? "";
  monsterHpEl.value = monster?.hp ?? 100;
  monsterAtkEl.value = monster?.atk ?? 10;
  monsterRoleEl.value = monster?.role ?? "melee";
  monsterModalEl.classList.remove("hidden");
}

function closeMonsterModal() {
  monsterModalEl.classList.add("hidden");
  monsterFormEl.reset();
}

function saveMonsterFromForm(event) {
  event.preventDefault();

  const editIndex = monsterEditIndexEl.value;
  const monster = {
    label: monsterLabelEl.value.trim(),
    hp: Number(monsterHpEl.value),
    atk: Number(monsterAtkEl.value),
    role: monsterRoleEl.value
  };

  if (!monster.label || monster.hp < 1 || monster.atk < 1) {
    alert("몬스터 정보를 올바르게 입력해주세요.");
    return;
  }

  if (editIndex !== "") {
    monsterJson[Number(editIndex)] = monster;
  } else {
    monsterJson.push(monster);
  }

  saveMonsterJson();
  refreshMonsterUI();
  closeMonsterModal();
}

function deleteSelectedMonsters() {
  const checkedIndexes = [...document.querySelectorAll(".monster-check:checked")]
    .map(input => Number(input.value))
    .sort((a, b) => b - a);

  if (checkedIndexes.length === 0) {
    alert("삭제할 몬스터를 선택해주세요.");
    return;
  }

  checkedIndexes.forEach(index => monsterJson.splice(index, 1));
  saveMonsterJson();
  refreshMonsterUI();
  updateStatusUI();
}

function resetMonsterJson() {
  monsterJson = DEFAULT_MONSTER_JSON.map(monster => ({ ...monster }));
  saveMonsterJson();
  refreshMonsterUI();
  updateStatusUI();
}

function initRoleOptions() {
  monsterRoleEl.innerHTML = ROLES.map(role => `<option value="${role}">${role}</option>`).join("");
  characterRoleEl.innerHTML = ROLES.map(role => `<option value="${role}">${role}</option>`).join("");
}

function loadCharacterJson() {
  const defaults = createDefaultCharacterJson();

  try {
    const savedJson = localStorage.getItem(CHARACTER_STORAGE_KEY);
    characterJson = savedJson
      ? normalizeCombatJson(JSON.parse(savedJson), defaults, "name")
      : defaults;
  } catch (error) {
    characterJson = defaults;
  }

  saveCharacterJson();
}

function saveCharacterJson() {
  try {
    localStorage.setItem(CHARACTER_STORAGE_KEY, JSON.stringify(characterJson));
  } catch (error) {
    log("캐릭터 JSON 저장에 실패했습니다.");
  }
}

function refreshCharacterUI() {
  renderCharacterTable();
  initCharacters();
  updateStatusUI();
}

function renderCharacterTable() {
  characterTableBodyEl.innerHTML = characterJson.map((character, index) => `
    <tr>
      <td><input type="checkbox" class="character-check" value="${index}"></td>
      <td>${escapeHtml(character.name)}</td>
      <td>${character.hp}</td>
      <td>${character.atk}</td>
      <td>${escapeHtml(character.role)}</td>
      <td><button onclick="openCharacterModal(${index})">수정</button></td>
    </tr>
  `).join("");
}

function openCharacterModal(index = "") {
  const character = characterJson[index];

  characterModalTitleEl.innerText = character ? "캐릭터 수정" : "캐릭터 추가";
  characterEditIndexEl.value = character ? index : "";
  characterNameEl.value = character?.name ?? "";
  characterHpEl.value = character?.hp ?? 100;
  characterAtkEl.value = character?.atk ?? 10;
  characterRoleEl.value = character?.role ?? "melee";
  characterModalEl.classList.remove("hidden");
}

function closeCharacterModal() {
  characterModalEl.classList.add("hidden");
  characterFormEl.reset();
}

function saveCharacterFromForm(event) {
  event.preventDefault();

  const editIndex = characterEditIndexEl.value;
  const character = {
    name: characterNameEl.value.trim(),
    hp: Number(characterHpEl.value),
    atk: Number(characterAtkEl.value),
    role: characterRoleEl.value
  };

  if (!character.name || character.hp < 1 || character.atk < 1) {
    alert("캐릭터 정보를 올바르게 입력해주세요.");
    return;
  }

  if (editIndex !== "") {
    characterJson[Number(editIndex)] = character;
  } else {
    characterJson.push(character);
  }

  playerSquad = [];
  saveCharacterJson();
  refreshCharacterUI();
  closeCharacterModal();
}

function deleteSelectedCharacters() {
  const checkedIndexes = [...document.querySelectorAll(".character-check:checked")]
    .map(input => Number(input.value))
    .sort((a, b) => b - a);

  if (checkedIndexes.length === 0) {
    alert("삭제할 캐릭터를 선택해주세요.");
    return;
  }

  checkedIndexes.forEach(index => characterJson.splice(index, 1));
  playerSquad = [];
  saveCharacterJson();
  refreshCharacterUI();
}

function resetCharacterJson() {
  characterJson = createDefaultCharacterJson();
  playerSquad = [];
  saveCharacterJson();
  refreshCharacterUI();
}

function createCharacter(characterData, index) {
  const role = characterData.role;

  return {
    id: index,
    role,
    name: characterData.name,
    hp: characterData.hp,
    maxHp: characterData.hp,
    atk: characterData.atk,
    x: Math.random() * canvas.width * 0.3,
    y: Math.random() * canvas.height,
    vx: 0,
    vy: 0,
    attackCooldown: 0,
    alive: true,
    stats: createStats(),
    effectType: null,
    effectTimer: 0
  };
}

function createEnemy(monsterIndex) {
  const monster = monsterJson[monsterIndex];
  if (!monster) {
    return null;
  }

  const role = monster.role;

  return {
    id: enemySquad.length,
    role,
    name: `${monster.label}-${enemySquad.length + 1}`,
    hp: monster.hp,
    maxHp: monster.hp,
    atk: monster.atk,
    x: Math.random() * 100 + 250,
    y: Math.random() * 200 + 50,
    vx: 0,
    vy: 0,
    attackCooldown: 0,
    alive: true,
    stats: createStats(),
    effectType: null,
    effectTimer: 0
  };
}

function resetUnitForBattle(unit) {
  unit.hp = unit.maxHp;
  unit.alive = true;
  unit.vx = 0;
  unit.vy = 0;
  unit.attackCooldown = 0;
  unit.stats = createStats();
  unit.effectType = null;
  unit.effectTimer = 0;
}

function log(message) {
  logEl.innerHTML += `${message}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function clampPosition(unit) {
  const margin = UNIT_RADIUS;

  unit.x = Math.max(margin, Math.min(canvas.width - margin, unit.x));
  unit.y = Math.max(margin, Math.min(canvas.height - margin, unit.y));
}

function syncAliveState(unit) {
  if (unit.hp <= 0) {
    unit.hp = 0;
    unit.alive = false;
  }
}

function triggerEffect(unit, effectType) {
  unit.effectType = effectType;
  unit.effectTimer = EFFECT_DURATION;
}

function initCharacters() {
  charactersEl.innerHTML = "";
  allCharacters = [];

  characterJson.forEach((characterData, index) => {
    const character = createCharacter(characterData, index);
    const button = document.createElement("button");

    allCharacters.push(character);
    button.innerText = character.name;
    button.onclick = () => toggleSelect(character, button);

    charactersEl.appendChild(button);
  });
}

function toggleSelect(character, button) {
  if (playerSquad.includes(character)) {
    playerSquad = playerSquad.filter(unit => unit !== character);
    button.style.background = "";
  } else if (playerSquad.length < MAX_PLAYER_SQUAD) {
    playerSquad.push(character);
    button.style.background = "lightblue";
  }

  updateStatusUI();
}

function selectEnemy(monsterIndex) {
  const enemy = createEnemy(monsterIndex);
  if (!enemy) {
    alert("존재하지 않는 몬스터입니다.");
    return;
  }

  enemySquad.push(enemy);
  updateStatusUI();
  log(`${enemy.name} 추가됨`);
}

function startBattle() {
  if (playerSquad.length < 1) {
    alert("최소 1명 필요");
    return;
  }

  if (enemySquad.length < 1) {
    alert("적을 1명 이상 추가해주세요");
    return;
  }

  playerSquad.forEach(resetUnitForBattle);
  enemySquad.forEach(resetUnitForBattle);

  isBattleRunning = true;
  updateBattleButton();
  log("전투 시작!");
}

function stopBattle() {
  isBattleRunning = false;
  updateBattleButton();
  log("전투 중지");
}

function toggleBattle() {
  if (isBattleRunning) {
    stopBattle();
  } else {
    startBattle();
  }
}

function setSpeed(speed) {
  gameSpeed = speed;
  log(`배속 x${speed}`);
}

function updateBattleButton() {
  battleBtnEl.innerText = isBattleRunning ? "전투 중지" : "전투 시작";
}

function updateMovement() {
  playerSquad.forEach(unit => moveUnit(unit, enemySquad));
  enemySquad.forEach(unit => moveUnit(unit, playerSquad));
}

function moveUnit(unit, targets) {
  if (!unit.alive) {
    return;
  }

  const target = targets.find(candidate => candidate.alive);
  if (!target) {
    return;
  }

  const dx = target.x - unit.x;
  const dy = target.y - unit.y;
  const dist = Math.hypot(dx, dy);

  if (dist === 0) {
    return;
  }

  const speed = BASE_MOVE_SPEED * (ROLE_STATS[unit.role]?.speedMultiplier ?? 1);
  const desiredRange = getUnitRange(unit.role);

  if (dist > desiredRange) {
    unit.vx = (dx / dist) * speed;
    unit.vy = (dy / dist) * speed;
  } else if (dist < desiredRange - 5 && (unit.role === "ranged" || unit.role === "healer")) {
    unit.vx = -(dx / dist) * speed;
    unit.vy = -(dy / dist) * speed;
  } else {
    unit.vx = 0;
    unit.vy = 0;
  }

  unit.x += unit.vx;
  unit.y += unit.vy;
  clampPosition(unit);
}

function resolveCollision() {
  const units = [...playerSquad, ...enemySquad];

  for (let i = 0; i < units.length; i++) {
    for (let j = i + 1; j < units.length; j++) {
      const a = units[i];
      const b = units[j];

      if (!a.alive || !b.alive) {
        continue;
      }

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);

      if (dist >= COLLISION_DISTANCE || dist === 0) {
        continue;
      }

      const overlap = (COLLISION_DISTANCE - dist) / 2;
      const nx = dx / dist;
      const ny = dy / dist;

      a.x -= nx * overlap;
      a.y -= ny * overlap;
      b.x += nx * overlap;
      b.y += ny * overlap;

      clampPosition(a);
      clampPosition(b);
    }
  }
}

function updateCombat() {
  const alivePlayers = playerSquad.filter(unit => unit.alive);
  const aliveEnemies = enemySquad.filter(unit => unit.alive);

  if (alivePlayers.length === 0 || aliveEnemies.length === 0) {
    isBattleRunning = false;
    updateBattleButton();
    log(alivePlayers.length > 0 ? "승리!" : "패배!");
    return;
  }

  alivePlayers.forEach(unit => takeAction(unit, alivePlayers, aliveEnemies));
  aliveEnemies.forEach(unit => takeAction(unit, aliveEnemies, alivePlayers));
}

function takeAction(unit, allies, enemies) {
  if (unit.attackCooldown > 0) {
    unit.attackCooldown--;
    return;
  }

  if (unit.role === "healer") {
    if (heal(unit, allies)) {
      unit.attackCooldown = ATTACK_COOLDOWN;
    }
    return;
  }

  const target = findTarget(unit, enemies);
  if (!target) {
    return;
  }

  if (unit.role === "ranged") {
    spawnProjectile(unit, target, "attack");
  } else {
    doAttack(unit, target);
  }

  unit.attackCooldown = ATTACK_COOLDOWN;
}

function findTarget(unit, enemies) {
  if (unit.role === "ranged") {
    return enemies.find(enemy => enemy.alive);
  }

  return enemies.find(enemy => enemy.alive && distance(unit, enemy) < 30);
}

function heal(healer, team) {
  const target = team.find(unit => unit.alive && unit.hp < unit.maxHp);
  if (!target) {
    return false;
  }

  spawnProjectile(healer, target, "heal");
  return true;
}

function applyHeal(healer, target) {
  if (!target.alive || target.hp <= 0) {
    return;
  }

  const amount = 10;
  const previousHp = target.hp;

  target.hp = Math.min(target.maxHp, target.hp + amount);
  healer.stats.heal += target.hp - previousHp;
  triggerEffect(target, "heal");
}

function doAttack(attacker, target) {
  const damage = attacker.atk;

  target.hp -= damage;
  target.stats.taken += damage;
  attacker.stats.damage += damage;

  syncAliveState(target);
  triggerEffect(target, "damage");
}

function spawnProjectile(source, target, type) {
  projectiles.push({
    source,
    target,
    type,
    x: source.x,
    y: source.y
  });
}

function updateProjectiles() {
  const activeProjectiles = [];

  projectiles.forEach(projectile => {
    const { source, target, type } = projectile;

    if (!target.alive || !source.alive) {
      return;
    }

    const dx = target.x - projectile.x;
    const dy = target.y - projectile.y;
    const dist = Math.hypot(dx, dy);

    if (dist <= PROJECTILE_SPEED || dist === 0) {
      if (type === "heal") {
        applyHeal(source, target);
      } else {
        doAttack(source, target);
      }
      return;
    }

    projectile.x += (dx / dist) * PROJECTILE_SPEED;
    projectile.y += (dy / dist) * PROJECTILE_SPEED;
    activeProjectiles.push(projectile);
  });

  projectiles = activeProjectiles;
}

function updateEffects() {
  [...playerSquad, ...enemySquad].forEach(unit => {
    if (unit.effectTimer > 0) {
      unit.effectTimer--;
      if (unit.effectTimer === 0) {
        unit.effectType = null;
      }
    }
  });
}

function drawUnit(unit, isEnemy) {
  if (!unit.alive) {
    return;
  }

  const isBlinkFrame = unit.effectTimer > 0 && Math.floor(unit.effectTimer / 3) % 2 === 0;
  const baseColor = isEnemy ? "red" : getRoleColor(unit.role);

  ctx.fillStyle = isBlinkFrame ? EFFECT_COLORS[unit.effectType] ?? baseColor : baseColor;
  ctx.beginPath();
  ctx.arc(unit.x, unit.y, UNIT_RADIUS * scale, 0, Math.PI * 2);
  ctx.fill();

  const hpRatio = unit.hp / unit.maxHp;

  ctx.fillStyle = "red";
  ctx.fillRect(unit.x - 10 * scale, unit.y - 12 * scale, 20 * scale, 3 * scale);

  ctx.fillStyle = "green";
  ctx.fillRect(unit.x - 10 * scale, unit.y - 12 * scale, 20 * scale * hpRatio, 3 * scale);

  ctx.fillStyle = "black";
  ctx.font = `${10 * scale}px Arial`;
  ctx.fillText(unit.name, unit.x - 12 * scale, unit.y - 16 * scale);
}

function drawProjectiles() {
  projectiles.forEach(projectile => {
    ctx.fillStyle = projectile.type === "heal" ? "#4fd88b" : "#ff9b54";
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, 3 * scale, 0, Math.PI * 2);
    ctx.fill();
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  playerSquad.forEach(unit => drawUnit(unit, false));
  enemySquad.forEach(unit => drawUnit(unit, true));
  drawProjectiles();
}

function renderStatus(units, colorResolver) {
  return units.map(unit => {
    const hpRatio = Math.max(0, (unit.hp / unit.maxHp) * 100);

    return `
      <div class="unit-status">
        <div>${unit.name} (${unit.role})</div>
        <div class="unit-meta">${Math.floor(unit.hp)} / ${unit.maxHp}</div>
        <div class="hp-track">
          <div class="hp-fill" style="width:${hpRatio}%; background:${colorResolver(unit)};"></div>
        </div>
      </div>
    `;
  }).join("");
}

function updateStatusUI() {
  playerStatusEl.innerHTML = renderStatus(playerSquad, unit => getRoleColor(unit.role));
  enemyStatusEl.innerHTML = renderStatus(enemySquad, () => "red");
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  scale = canvas.width / 400;
}

function resetGame() {
  isBattleRunning = false;
  gameSpeed = 1;
  playerSquad = [];
  enemySquad = [];
  projectiles = [];

  initCharacters();
  updateBattleButton();
  updateStatusUI();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  log("게임 초기화 완료");
}

function gameLoop() {
  if (isBattleRunning) {
    for (let i = 0; i < gameSpeed; i++) {
      if (!isBattleRunning) {
        break;
      }

      updateMovement();
      resolveCollision();
      updateCombat();
      updateProjectiles();
      updateEffects();
    }
  } else {
    updateEffects();
  }

  draw();
  updateStatusUI();
  requestAnimationFrame(gameLoop);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

loadMonsterJson();
loadCharacterJson();
initRoleOptions();
refreshMonsterUI();
refreshCharacterUI();
updateBattleButton();
updateStatusUI();
gameLoop();
</script>

</body>
</html>
