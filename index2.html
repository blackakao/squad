<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Auto Battle Prototype</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>스쿼드 자동전투 프로토타입</h2>

<div class="nav">
  <button onclick="showPage('battle')">전투</button>
  <button onclick="showPage('character')">캐릭터 관리</button>
  <button onclick="showPage('faction')">진영 관리</button>
  <button onclick="showPage('stats')">스탯 관리</button>
  <button onclick="showPage('monster')">몬스터 관리</button>
  <button onclick="showPage('record')">전투 기록</button>
</div>

<div id="root" class="page">
  <div class="col left">
    <div class="panel char-panel">
      <h4>내 캐릭터</h4>
      <div id="characters"></div>
    </div>

    <div class="panel status-panel">
      <h4>아군 상태</h4>
      <div id="playerStatus"></div>
    </div>
  </div>

  <div class="col center">
    <div class="panel battle-panel">
      <canvas id="battleCanvas"></canvas>
    </div>

    <div class="panel control-panel">
      <h4>조작</h4>
      <button id="battleBtn" onclick="toggleBattle()">전투 시작</button>
      <button onclick="resetGame()">초기화</button>

      <h4>배속</h4>
      <button onclick="setSpeed(1)">x1</button>
      <button onclick="setSpeed(2)">x2</button>
      <button onclick="setSpeed(4)">x4</button>
    </div>
  </div>

  <div class="col right">
    <div class="panel enemy-control">
      <h4>적 추가</h4>
      <div id="enemyButtons"></div>
    </div>

    <div class="panel status-panel">
      <h4>적 상태</h4>
      <div id="enemyStatus"></div>
    </div>
  </div>
</div>

<div id="monsterPage" class="page hidden">
  <div class="panel">
    <h4>몬스터 관리</h4>
    <div class="data-toolbar">
      <button onclick="openMonsterModal()">추가</button>
      <button onclick="deleteSelectedMonsters()">선택 삭제</button>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>이름</th>
          <th>체력</th>
          <th>공격력</th>
          <th>마력</th>
          <th>이동속도</th>
          <th>공격속도</th>
          <th>방어력</th>
          <th>저항력</th>
          <th>사정거리</th>
          <th>계열</th>
          <th>수정</th>
        </tr>
      </thead>
      <tbody id="monsterTableBody"></tbody>
    </table>
  </div>
</div>

<div id="characterPage" class="page hidden">
  <div class="panel">
    <h4>캐릭터 관리</h4>
    <div class="data-toolbar">
      <button onclick="openCharacterModal()">추가</button>
      <button onclick="deleteSelectedCharacters()">선택 삭제</button>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>진영</th>
          <th>계열</th>
          <th>이름</th>
          <th>체력</th>
          <th>공격력</th>
          <th>마력</th>
          <th>이동속도</th>
          <th>공격속도</th>
          <th>방어력</th>
          <th>저항력</th>
          <th>사정거리</th>
          <th>수정</th>
        </tr>
      </thead>
      <tbody id="characterTableBody"></tbody>
    </table>
  </div>
</div>

<div id="factionPage" class="page hidden">
  <div class="panel">
    <h4>진영 관리</h4>
    <div class="data-toolbar">
      <input id="factionName" placeholder="진영 이름">
      <button onclick="addFactionFromInput()">추가</button>
      <button onclick="deleteSelectedFactions()">선택 삭제</button>
    </div>
    <table class="data-table faction-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>진영</th>
          <th>캐릭터</th>
          <th>수정</th>
        </tr>
      </thead>
      <tbody id="factionTableBody"></tbody>
    </table>
  </div>
</div>

<div id="statsPage" class="page hidden">
  <div class="panel">
    <h4>스탯 관리</h4>
    <div class="stat-manager">
      <div class="stat-character-list">
        <h5>캐릭터</h5>
        <div id="statCharacterButtons"></div>
      </div>
      <div class="stat-editor">
        <div class="stat-editor-header">
          <div>
            <div id="statSelectedName" class="stat-selected-name">캐릭터를 선택하세요</div>
            <div id="statPointSummary" class="stat-point-summary">0 / 150</div>
          </div>
          <button type="button" onclick="resetSelectedCharacterStats()">초기화</button>
        </div>
        <div id="statRows" class="stat-rows"></div>
        <div class="stat-actions">
          <button type="button" onclick="saveSelectedCharacterStats()">적용</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="recordPage" class="page hidden">
  <div class="panel">
    <h4>전투 기록</h4>
    <div class="data-toolbar">
      <button onclick="deleteSelectedBattleRecords()">선택 삭제</button>
      <button onclick="clearBattleRecords()">기록 비우기</button>
    </div>
    <table class="data-table record-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>전투일시</th>
          <th>결과</th>
          <th>아군 멤버</th>
          <th>몬스터 멤버</th>
          <th>소요시간</th>
        </tr>
      </thead>
      <tbody id="recordTableBody"></tbody>
    </table>
    <div id="recordPagination" class="pagination"></div>
  </div>
</div>

<div id="monsterModal" class="modal hidden">
  <div class="modal-content">
    <h4 id="monsterModalTitle">몬스터 추가</h4>
    <form id="monsterForm" onsubmit="saveMonsterFromForm(event)">
      <input type="hidden" id="monsterEditIndex">
      <div class="form-row">
        <label for="monsterLabel">이름</label>
        <input id="monsterLabel" required placeholder="슬라임">
      </div>
      <div class="form-row">
        <label for="monsterHp">체력</label>
        <input id="monsterHp" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="monsterAtk">공격력</label>
        <input id="monsterAtk" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="monsterMagic">마력</label>
        <input id="monsterMagic" type="number" min="0" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="monsterSpeed">이동속도</label>
        <input id="monsterSpeed" type="number" min="0.1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="monsterAttackSpeed">공격속도</label>
        <input id="monsterAttackSpeed" type="number" min="0.1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="monsterDefense">방어력</label>
        <input id="monsterDefense" type="number" min="0" max="100" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="monsterResistance">저항력</label>
        <input id="monsterResistance" type="number" min="0" max="100" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="monsterAttackRange">사정거리</label>
        <input id="monsterAttackRange" type="number" min="1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="monsterRole">계열</label>
        <select id="monsterRole" required></select>
      </div>
      <button type="submit">저장</button>
      <button type="button" onclick="closeMonsterModal()">취소</button>
    </form>
  </div>
</div>

<div id="characterModal" class="modal hidden">
  <div class="modal-content">
    <h4 id="characterModalTitle">캐릭터 추가</h4>
    <form id="characterForm" onsubmit="saveCharacterFromForm(event)">
      <input type="hidden" id="characterEditIndex">
      <div class="form-row">
        <label for="characterName">이름</label>
        <input id="characterName" required placeholder="tank1">
      </div>
      <div class="form-row">
        <label for="characterHp">체력</label>
        <input id="characterHp" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="characterAtk">공격력</label>
        <input id="characterAtk" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="characterMagic">마력</label>
        <input id="characterMagic" type="number" min="0" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="characterSpeed">이동속도</label>
        <input id="characterSpeed" type="number" min="0.1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="characterAttackSpeed">공격속도</label>
        <input id="characterAttackSpeed" type="number" min="0.1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="characterDefense">방어력</label>
        <input id="characterDefense" type="number" min="0" max="100" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="characterResistance">저항력</label>
        <input id="characterResistance" type="number" min="0" max="100" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="characterAttackRange">사정거리</label>
        <input id="characterAttackRange" type="number" min="1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="characterRole">계열</label>
        <select id="characterRole" required></select>
      </div>
      <div class="form-row">
        <label for="characterFaction">진영</label>
        <select id="characterFaction" required></select>
      </div>
      <button type="submit">저장</button>
      <button type="button" onclick="closeCharacterModal()">취소</button>
    </form>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/monster.js"></script>
<script src="js/faction.js"></script>
<script src="js/character.js"></script>
<script src="js/stats.js"></script>
<script src="js/record.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>

</body>
</html>
