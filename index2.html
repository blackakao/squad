<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Auto Battle Prototype</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

h2 {
  margin: 16px;
}

.nav {
  margin: 0 16px 8px;
}

.page {
  width: 100%;
}

.page.hidden,
.modal.hidden {
  display: none;
}

.hidden {
  display: none !important;
}

#root {
  display: flex;
  width: 100%;
  height: calc(100vh - 64px);
}

.col {
  display: flex;
  flex-direction: column;
  padding: 5px;
  box-sizing: border-box;
}

.col.left { width: 25%; }
.col.center { width: 50%; }
.col.right { width: 25%; }

.panel {
  border: 1px solid #ccc;
  padding: 8px;
  margin-bottom: 5px;
  box-sizing: border-box;
}

.char-panel,
.enemy-control {
  height: 40%;
  overflow-y: auto;
}

.status-panel {
  flex: 1;
  overflow-y: auto;
}

.battle-panel {
  height: 80%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.control-panel {
  height: 20%;
  overflow-y: auto;
}

#battleCanvas {
  width: 100%;
  height: 100%;
  border: 1px solid #000;
}

button {
  margin: 3px;
}

.unit-status {
  margin-bottom: 10px;
}

.unit-meta {
  font-size: 11px;
}

.hp-track {
  background: #ddd;
}

.hp-fill {
  height: 6px;
}

#log {
  margin-top: 8px;
  max-height: 70px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.4;
  border-top: 1px solid #ddd;
  padding-top: 6px;
}

#monsterPage,
#characterPage,
#recordPage {
  box-sizing: border-box;
  height: calc(100vh - 96px);
  padding: 5px 16px 16px;
}

.data-toolbar {
  margin-bottom: 8px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.data-table th,
.data-table td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
  vertical-align: middle;
}

.data-table th:first-child,
.data-table td:first-child {
  width: 44px;
  text-align: center;
}

.data-table th:last-child,
.data-table td:last-child {
  width: 90px;
  text-align: center;
}

.record-table th:first-child,
.record-table td:first-child,
.record-table th:last-child,
.record-table td:last-child {
  width: auto;
  text-align: center;
}

.member-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 12px;
}

.member-table th,
.member-table td {
  border: 1px solid #ddd;
  padding: 4px;
  text-align: center;
}

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}

.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
}

.modal-content {
  width: min(420px, calc(100vw - 32px));
  border: 1px solid #999;
  background: #fff;
  padding: 16px;
  box-sizing: border-box;
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

.form-row input,
.form-row select {
  padding: 6px;
  box-sizing: border-box;
}
</style>
</head>
<body>

<h2>스쿼드 자동전투 프로토타입</h2>

<div class="nav">
  <button onclick="showPage('battle')">전투</button>
  <button onclick="showPage('character')">캐릭터 관리</button>
  <button onclick="showPage('monster')">몬스터 관리</button>
  <button onclick="showPage('record')">전투 기록</button>
</div>

<div id="root" class="page">
  <div class="col left">
    <div class="panel char-panel">
      <h4>내 캐릭터</h4>
      <div id="characters"></div>
    </div>

    <div class="panel status-panel">
      <h4>아군 상태</h4>
      <div id="playerStatus"></div>
    </div>
  </div>

  <div class="col center">
    <div class="panel battle-panel">
      <canvas id="battleCanvas"></canvas>
    </div>

    <div class="panel control-panel">
      <h4>조작</h4>
      <button id="battleBtn" onclick="toggleBattle()">전투 시작</button>
      <button onclick="resetGame()">초기화</button>

      <h4>배속</h4>
      <button onclick="setSpeed(1)">x1</button>
      <button onclick="setSpeed(2)">x2</button>
      <button onclick="setSpeed(4)">x4</button>

      <div id="log"></div>
    </div>
  </div>

  <div class="col right">
    <div class="panel enemy-control">
      <h4>적 추가</h4>
      <div id="enemyButtons"></div>
    </div>

    <div class="panel status-panel">
      <h4>적 상태</h4>
      <div id="enemyStatus"></div>
    </div>
  </div>
</div>

<div id="monsterPage" class="page hidden">
  <div class="panel">
    <h4>몬스터 관리</h4>
    <div class="data-toolbar">
      <button onclick="openMonsterModal()">추가</button>
      <button onclick="deleteSelectedMonsters()">선택 삭제</button>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>이름</th>
          <th>체력</th>
          <th>공격력</th>
          <th>이동속도</th>
          <th>역할</th>
          <th>수정</th>
        </tr>
      </thead>
      <tbody id="monsterTableBody"></tbody>
    </table>
  </div>
</div>

<div id="characterPage" class="page hidden">
  <div class="panel">
    <h4>캐릭터 관리</h4>
    <div class="data-toolbar">
      <button onclick="openCharacterModal()">추가</button>
      <button onclick="deleteSelectedCharacters()">선택 삭제</button>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>이름</th>
          <th>체력</th>
          <th>공격력</th>
          <th>이동속도</th>
          <th>역할</th>
          <th>수정</th>
        </tr>
      </thead>
      <tbody id="characterTableBody"></tbody>
    </table>
  </div>
</div>

<div id="recordPage" class="page hidden">
  <div class="panel">
    <h4>전투 기록</h4>
    <div class="data-toolbar">
      <button onclick="deleteSelectedBattleRecords()">선택 삭제</button>
      <button onclick="clearBattleRecords()">기록 비우기</button>
    </div>
    <table class="data-table record-table">
      <thead>
        <tr>
          <th>선택</th>
          <th>전투일시</th>
          <th>결과</th>
          <th>아군 멤버</th>
          <th>몬스터 멤버</th>
          <th>소요시간</th>
        </tr>
      </thead>
      <tbody id="recordTableBody"></tbody>
    </table>
    <div id="recordPagination" class="pagination"></div>
  </div>
</div>

<div id="monsterModal" class="modal hidden">
  <div class="modal-content">
    <h4 id="monsterModalTitle">몬스터 추가</h4>
    <form id="monsterForm" onsubmit="saveMonsterFromForm(event)">
      <input type="hidden" id="monsterEditIndex">
      <div class="form-row">
        <label for="monsterLabel">이름</label>
        <input id="monsterLabel" required placeholder="슬라임">
      </div>
      <div class="form-row">
        <label for="monsterHp">체력</label>
        <input id="monsterHp" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="monsterAtk">공격력</label>
        <input id="monsterAtk" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="monsterSpeed">이동속도</label>
        <input id="monsterSpeed" type="number" min="0.1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="monsterRole">역할</label>
        <select id="monsterRole" required></select>
      </div>
      <button type="submit">저장</button>
      <button type="button" onclick="closeMonsterModal()">취소</button>
    </form>
  </div>
</div>

<div id="characterModal" class="modal hidden">
  <div class="modal-content">
    <h4 id="characterModalTitle">캐릭터 추가</h4>
    <form id="characterForm" onsubmit="saveCharacterFromForm(event)">
      <input type="hidden" id="characterEditIndex">
      <div class="form-row">
        <label for="characterName">이름</label>
        <input id="characterName" required placeholder="tank1">
      </div>
      <div class="form-row">
        <label for="characterHp">체력</label>
        <input id="characterHp" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="characterAtk">공격력</label>
        <input id="characterAtk" type="number" min="1" required>
      </div>
      <div class="form-row">
        <label for="characterSpeed">이동속도</label>
        <input id="characterSpeed" type="number" min="0.1" step="0.1" required>
      </div>
      <div class="form-row">
        <label for="characterRole">역할</label>
        <select id="characterRole" required></select>
      </div>
      <button type="submit">저장</button>
      <button type="button" onclick="closeCharacterModal()">취소</button>
    </form>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/monster.js"></script>
<script src="js/character.js"></script>
<script src="js/record.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>

</body>
</html>
