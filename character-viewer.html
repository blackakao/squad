<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SD 캐릭터 개발 · GLB 조립</title>
  <link rel="stylesheet" href="css/character-viewer.css?v=20261016-assembler2">
  <script type="importmap">{"imports":{"three":"./assets/vendor/three/build/three.module.js","three/addons/":"./assets/vendor/three/examples/jsm/"}}</script>
</head>
<body class="assembler-page">
  <header class="assembler-header">
    <div><h1>SD 캐릭터 개발 <span>GLB ASSEMBLER</span></h1><p>외부 GLB 신체 파츠와 시각 장비를 조합합니다.</p></div>
    <div class="gender-switch" role="group" aria-label="베이스 성별"><button type="button" data-gender="male">남성</button><button type="button" data-gender="female" aria-pressed="true">여성</button></div>
    <a href="/">게임으로 돌아가기 ↗</a>
  </header>
  <main class="assembler-layout">
    <aside class="assembler-panel body-panel">
      <div class="panel-heading"><div><strong>신체 조합</strong><small>GLB CHARACTER PARTS</small></div><button id="catalog-refresh" type="button" title="폴더 목록 새로고침">↻</button></div>
      <fieldset class="assembler-controls" disabled><div id="body-part-list" class="part-list"></div></fieldset>
    </aside>

    <section class="preview-column">
      <div id="viewport" aria-label="3D 미리보기"><p class="viewport-hint">왼쪽 드래그: 회전 · 휠: 확대/축소 · 오른쪽 드래그: 이동</p></div>
      <div class="primary-actions">
        <button id="random-composition" class="accent" type="button">무작위 조합</button>
        <button id="portrait-download" type="button">초상화 PNG</button>
        <input id="composition-name" type="text" maxlength="60" placeholder="조합 이름">
        <button id="save-composition" type="button">저장</button>
        <button id="restore-composition" type="button">불러오기</button>
      </div>
      <p id="assembly-status" role="status">GLB 카탈로그를 준비합니다.</p>
      <div class="secondary-tools">
        <details><summary>동작 테스트</summary><fieldset id="animation-controls" disabled><select id="clip-select"><option>애니메이션 없음</option></select><div class="button-row"><button id="play" type="button">재생</button><button id="pause" type="button">일시정지</button><button id="stop" type="button">정지</button></div><label class="check"><input id="loop" type="checkbox" checked> 반복</label><p id="playback-status" class="hint">재생 준비</p></fieldset></details>
        <details><summary>보기 설정</summary><div class="button-row"><button id="frame-model" type="button">전체 보기</button><label class="check"><input id="show-skeleton" type="checkbox"> Skeleton</label></div></details>
        <details><summary>개발 정보</summary><pre id="debug-info">모델 정보 없음</pre><p><a href="character-viewer-legacy.html">Legacy JS 파츠 테스트 열기 ↗</a></p></details>
      </div>
    </section>

    <aside class="assembler-panel equipment-panel">
      <div class="panel-heading"><div><strong>장비 조합</strong><small>VISUAL EQUIPMENT</small></div></div>
      <fieldset class="assembler-controls" disabled><div id="equipment-part-list" class="part-list"></div></fieldset>
      <p class="panel-note">게임 아이템·능력치와 분리된 외형 테스트입니다.</p>
    </aside>
  </main>
  <script type="module">import('./js/character-viewer/main-assembler.js?v=20261016-assembler2').catch(error => { const el=document.getElementById('assembly-status'); el.textContent=`초기화 실패: ${error.message}`; el.dataset.error='true'; });</script>
</body>
</html>
